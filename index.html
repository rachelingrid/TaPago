<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5d55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tá Pago</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d2321;--mute:#62696a;--line:#e4e0d8;--acc:#0f5d55;--onacc:#fff;--acc2:#e6f0ee;--warn:#9a5200;--warnbg:#fdf2e2;--bad:#b42318;--badbg:#fdecea;--ok:#157a3d;--okbg:#e6f4eb;--bar:#9cc3bc;--barcur:#0f5d55;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s0:#a9a8a2}
@media (prefers-color-scheme:dark){:root{--bg:#111413;--card:#1a1e1d;--ink:#e7ebe9;--mute:#9aa4a0;--line:#2a302e;--acc:#5fbfb1;--onacc:#08201c;--acc2:#1d2b28;--warn:#f0a956;--warnbg:#2c2316;--bad:#f2786c;--badbg:#311a18;--ok:#6fcf8f;--okbg:#16281d;--bar:#355f59;--barcur:#5fbfb1;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s0:#5f5e59}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.mes{display:flex;align-items:center;gap:2px}
.mes span{min-width:112px;text-align:center;font-weight:600;text-transform:capitalize;font-size:14px}
.mes button{background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:20px;border:1px solid var(--line)}
main{padding:12px 16px 120px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card.alert{border-color:var(--warn);background:var(--warnbg)}
.card.inbox{border-color:var(--acc);background:var(--acc2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{color:var(--mute);display:block;font-size:12px}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.grp h3,.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
h3+.row,.sec+.row{border-top:0}
.ri{flex:1;min-width:0}
.ri b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri small,.mute{color:var(--mute);font-size:12.5px}
.rv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:700;margin-top:2px}
.st-pago{background:var(--okbg);color:var(--ok)}.st-vencido{background:var(--badbg);color:var(--bad)}.st-logo{background:var(--warnbg);color:var(--warn)}.st-pendente{background:var(--acc2);color:var(--acc)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:14px;font-size:16px;width:100%;text-align:left;display:flex;gap:12px;align-items:center}
.btn.big span{font-size:24px}
.btn.big small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.btn.pri.big small{color:inherit;opacity:.85}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.btn:disabled{opacity:.5}
.rowbtns{display:flex;flex-direction:column;gap:4px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font:inherit;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button[aria-current=true]{color:var(--acc);font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:0 5px;line-height:16px}
#fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));height:58px;padding:0 20px;border-radius:18px;border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6;display:flex;align-items:center;gap:8px}
#fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;padding:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:94vh;margin:auto auto 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-height:94vh}
.dlg h2{margin:0 0 4px;font-size:18px}
.stack{display:grid;gap:8px;margin-top:12px}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:4px;min-width:0}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.inline{display:flex;gap:6px;align-items:flex-end}.inline>*:first-child{flex:1;min-width:0}.inline .btn{flex:none}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts.left{justify-content:flex-start;margin-top:8px}
.scan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 2px}
.info{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--acc2);margin-top:8px}
.info.warn{background:var(--warnbg);color:var(--warn)}
.chart{width:100%;height:auto;display:block;margin:6px 0;overflow:visible}
.chart .bar{fill:var(--bar)}.chart .cur{fill:var(--barcur)}.chart .lb{font-size:9px;fill:var(--mute);text-anchor:middle}
.chart .avg{stroke:var(--mute);stroke-dasharray:4 3;stroke-width:1.5}.chart .avgt{font-size:10px;fill:var(--mute);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:pointer}
.spark{width:64px;height:22px;flex:none}.spark rect{fill:var(--bar)}.spark rect.cur{fill:var(--barcur)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin:8px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{grid-column:1/3;position:relative;height:8px}
.hb .t{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--acc)}
.hb .mk{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.hb .d{grid-column:1/3;font-size:12px;color:var(--mute)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 4px;display:flex}
.prog i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px dashed var(--mute);background:none;color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px}
.tchip.sel,.tchip.sug{border-style:solid;border-color:var(--acc);background:var(--acc2);font-weight:600}
.vazio,.hint{color:var(--mute);font-size:13.5px}
.vazio{text-align:center;padding:24px 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.foto img{max-width:100%;border-radius:10px;margin-top:8px;max-height:340px;object-fit:contain;background:var(--bg)}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
.conta{border:1px solid var(--line);border-radius:12px;padding:4px 10px 10px;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;font-size:11px;text-align:center}
.cal .h{color:var(--mute);font-weight:700;padding:2px 0}
.cal .d{border-radius:8px;padding:4px 1px 3px;min-height:40px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent}
.cal .d b{font-size:12px;font-weight:600}
.cal .d small{font-size:9.5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.cal .d.hj{border-color:var(--ink)}
.cal .d.c-pago{background:var(--okbg);color:var(--ok)}.cal .d.c-vencido{background:var(--badbg);color:var(--bad)}.cal .d.c-logo{background:var(--warnbg);color:var(--warn)}.cal .d.c-pendente{background:var(--acc2);color:var(--acc)}
.cal .d.vz{background:none}
.streak{display:flex;align-items:center;gap:10px}
.streak .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;width:max-content;max-width:min(92vw,440px);text-align:left;display:flex;gap:10px;align-items:center}
#toast span{flex:1;min-width:0}
#toast button{flex:none}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;padding:2px 4px}
#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px;white-space:pre-line}
#tip.on{opacity:1}
#festa{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#festa.on{opacity:1}
#festa .ck{width:120px;height:120px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
#festa.on .ck{transform:scale(1)}
#festa svg{width:70px;height:70px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .4s .15s}
#festa.on svg{stroke-dashoffset:0}
#festa p{margin:0;color:#fff;font-size:20px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.4);text-align:center;padding:0 20px}
#festa small{color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4);text-align:center;padding:0 20px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mute);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#festa svg{stroke-dashoffset:0}}
@media print{.tabs,#fab,.noprint,.mes button{display:none!important}body,html{background:#fff;color:#000}.top{position:static;border:0}main{padding:0;max-width:none}.card{border:1px solid #ccc;break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <h1 id="titulo">Tá Pago</h1>
  <div class="mes"><button id="mesAnt" aria-label="Mês anterior">‹</button><span id="mesLabel"></span><button id="mesProx" aria-label="Próximo mês">›</button></div>
</header>
<main>
  <section id="v-mes" class="view"></section>
  <section id="v-itens" class="view" hidden></section>
  <section id="v-rel" class="view" hidden></section>
  <section id="v-mais" class="view" hidden></section>
</main>
<button id="fab" aria-label="Adicionar conta, comprovante ou nota"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Adicionar</button>
<nav class="tabs">
  <button data-v="mes"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês<span class="bdg" id="bdgMes" hidden></span></button>
  <button data-v="itens"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Itens</button>
  <button data-v="rel"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8"/></svg>Relatório</button>
  <button data-v="mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileForm" accept="image/*,application/pdf" hidden>
<input type="file" id="fileImp" accept=".csv,.json,text/csv,application/json" hidden>
<div id="toast" role="status"></div>
<div id="tip"></div>
<div id="festa" aria-hidden="true"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><p id="festaT">Tá pago!</p><small id="festaS"></small></div>

<script>
'use strict';
/* ===================== utilidades ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const KEY = 'contas.v1';
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => brl.format(v || 0);
const fmtK = v => v >= 1000 ? 'R$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace('.', ',') + 'k' : 'R$' + Math.round(v);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soma = (a, f) => a.reduce((s, x) => s + f(x), 0);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diasEntre = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const diasAte = s => diasEntre(hojeISO(), s);
const fmtData = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const dataBR = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
function addDias(isoStr, n) { const d = parseISO(isoStr); d.setDate(d.getDate() + n); return iso(d); }
function ymAdd(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); }
const ymLabel = ym => MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymCurto = ym => MESES[+ym.slice(5, 7) - 1].slice(0, 3);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function parseValor(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = parseFloat(s); return isNaN(v) ? 0 : Math.round(v * 100) / 100;
}
const valorCampo = v => v ? v.toFixed(2).replace('.', ',') : '';
function toast(msg, ms = 2800, botoes = []) {
  const t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + botoes.map((b, k) => `<button data-k="${k}">${esc(b[0])}</button>`).join('');
  botoes.forEach((b, k) => { t.querySelector(`[data-k="${k}"]`).onclick = () => { t.classList.remove('on'); b[1](); }; });
  t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), botoes.length ? Math.max(ms, 6000) : ms);
}
function festa(t, s) {
  const f = $('#festa'); $('#festaT').textContent = t; $('#festaS').textContent = s || '';
  f.classList.add('on'); navigator.vibrate?.([30, 40, 60]); clearTimeout(f._h); f._h = setTimeout(() => f.classList.remove('on'), 1500);
}
function carregarScript(src) {
  return new Promise((res, rej) => { if ($(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('não carregou ' + src)); document.head.appendChild(s); });
}

/* ===================== dados ===================== */
const FORMAS = ['Crédito Visa Infinite','Crédito Nu Platinum','Débito Kel','Pix Kel','Débito Pai','Pix Pai'];
const SEED = [
  ['fixos','Gastos fixos',[['Aluguel',1],['Água',1],['Luz',1],['Gás',1],['Condomínio',1],['Internet',1],['Tel. móvel 1',1,{tel:1}]]],
  ['saude','Saúde',[['Plano de saúde',1],['Farmácia',0,{qr:1}]]],
  ['educacao','Educação',[['Colégio Santa Mônica — Valentim',1]]],
  ['alimentacao','Alimentação',[['Padaria',0],['Mercado',0],['Hortifruti',0]]],
  ['carro','Carro',[['Aluguel do carro',1,{carro:'alugado'}],['Gasolina',0],['Parcela do carro',1,{carro:'proprio'}],['IPVA',0,{carro:'proprio'}],['Seguro do carro',1,{carro:'proprio'}],['Manutenção do carro',0]]],
  ['transporte','Transporte',[['Uber',0],['99 Táxi',0]]],
  ['lazer','Lazer',[['Restaurante',0],['iFood',0]]],
  ['extras','Gastos extras',[['Roupa',0],['Manutenção da casa',0]]],
  ['digital','Digital',[['Google',1],['Claude',1],['ChatGPT',1],['Canva',1],['CapCut',1],['Wix',1],['MashAI',1],['Suno',1]]],
  ['praia','Casa de praia',[['Caseiro',1],['Água',1],['Luz',1],['IPTU',1],['Manutenção',0]]],
  ['serra','Casa da serra',[['IPTU',1],['Água',1],['Luz',1],['Manutenção',0]]],
  ['emprestimos','Empréstimos e parcelamentos',[]],
  ['reserva','Reserva e previdência',[['Fundo de reserva',1],['Previdência privada Rachel',1],['INSS Rachel',1]]],
];
const CFG0 = { ant: 3, carro: 'ambos', formas: FORMAS.slice(), autoGerar: true, gerado: '', ritual: 0 };
function novoDB() {
  return { v: 2,
    cats: SEED.map(([id, nome, itens]) => ({ id, nome, itens: itens.map(([n, rec, ex]) => ({ id: uid(), nome: n, rec: !!rec, dia: null, vp: null, oculto: false, ...(ex || {}) })) })),
    lanc: [], regras: {}, cfg: { ...CFG0 }, banco: null };
}
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.cats) { j.regras ||= {}; j.cfg = { ...CFG0, ...(j.cfg || {}) }; return j; } } catch (e) {}
  return novoDB();
}
let db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Erro ao salvar: armazenamento cheio?'); } syncPendentes(); atualizarBadge(); }

const todosItens = () => db.cats.flatMap(c => c.itens);

let _idb;

    const r = indexedDB.open('contas', 2);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ['fotos', 'kv', 'entrada']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

const idbGet = (s, k) => idbOp(s, 'readonly', o => o.get(k));

  if (!f) return '';
  const cands = [addDias('1997-10-07', f)];
  if (f >= 1000) cands.push(addDias('2025-02-22', f - 1000));   // reinício do fator em 22/02/2025
  return cands.sort((a, b) => Math.abs(diasAte(a)) - Math.abs(diasAte(b)))[0];

    return { tipo: 'nfce', cod: raw, chave, cnpj: chave ? chave.slice(6, 20) : '', valor, texto: 'Nota fiscal (NFC-e)' + (chave ? ' — chave ' + chave.slice(0, 6) + '…' + chave.slice(-6) : '') };
  }

  if (d[0] === '8') {

    const valor = (d[2] === '6' || d[2] === '8') ? parseInt(d.slice(4, 15), 10) / 100 : 0;
    const emp = d[1] === '6' ? d.slice(15, 23) : d.slice(15, 19);

    texto: 'Boleto ' + (BANCOS[d.slice(0, 3)] || 'banco ' + d.slice(0, 3)) + (ok ? '' : ' · ⚠ código não confere') };
}

/* --- leitor de código de barras ITF (Intercalado 2 de 5, usado em todo boleto) — sem depender do navegador --- */
const ITF = ['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'];
function itfDeRuns(r) {
  // r: larguras alternadas começando por barra. Procura start(4 finos) + 22 pares + stop.
  for (let i = 0; i + 227 <= r.length; i += 2) {
    const n = (r[i] + r[i + 1] + r[i + 2] + r[i + 3]) / 4;
    if (Math.max(r[i], r[i + 1], r[i + 2], r[i + 3]) > n * 1.8 || Math.min(r[i], r[i + 1], r[i + 2], r[i + 3]) < n * .45) continue;
    let dig = '', k = i + 4, ok = true;
    for (let p = 0; p < 22 && ok; p++, k += 10) {
      for (const off of [0, 1]) {
        const g = [0, 2, 4, 6, 8].map(j => r[k + j + off]);
        const ord = g.map((v, j) => [v, j]).sort((a, b) => b[0] - a[0]);
        if (ord[1][0] < ord[2][0] * 1.4) { ok = false; break; }
        const pat = [0, 0, 0, 0, 0]; pat[ord[0][1]] = 1; pat[ord[1][1]] = 1;
        const dgt = ITF.indexOf(pat.join('')); if (dgt < 0) { ok = false; break; }
        dig += dgt;

  }

}

    const c = desenhar(src, g, 2400), W = c.width, H = c.height;

    for (let t = 0; t < linhas; t++) {

      const lum = new Float32Array(W);

      }
      runs.push([cor, len]);
      for (const sentido of [runs, runs.slice().reverse()]) {
        const st = sentido.findIndex(r => r[0]); if (st < 0) continue;
        const r = sentido.slice(st).map(x => x[1]);
        const d = itfDeRuns(r); if (d) return d;

async function detectarCodigos(src) {

    try {

      const det = new BarcodeDetector({ formats: ['qr_code', 'itf', 'code_128'].filter(f => sup.includes(f)) });
      for (const g of [0, 90]) { const r = await det.detect(desenhar(src, g)); r.forEach(x => achados.push(x.rawValue)); if (achados.length) break; }

/* --- PDF offline (pdf.js) --- */
async function abrirPDF(blob) {
  await carregarScript('lib/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false, useSystemFonts: true }).promise;
  let texto = '';

    const tc = await (await pdf.getPage(p)).getTextContent();
    texto += tc.items.map(i => i.str + (i.hasEOL ? '\n' : ' ')).join('') + '\n';
  }
  const pg = await pdf.getPage(1), vp0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(3, 2200 / vp0.width) });

  await pg.render({ canvasContext: ctx, viewport: vp }).promise;
  return { texto, canvas: c };

  t = String(t || '').replace(/[|!;”“"'*º°_~^`´]/g, ' ').replace(/\s+/g, ' ').trim();

/* ===================== gráficos (SVG) ===================== */
function inicioDados() { let m = null; for (const l of db.lanc) { const x = mesDe(l); if (x && (!m || x < m)) m = x; } return m; }
function mesesAte(ate, n = 12) { const m = []; for (let k = n - 1; k >= 0; k--) m.push(ymAdd(ate, -k)); return m; }
function idxMedia(meses) {
  const ini = inicioDados(), atual = hojeISO().slice(0, 7);
  let idx = meses.map((m, k) => k).filter(k => ini && meses[k] >= ini && meses[k] < atual);
  if (!idx.length) idx = meses.map((m, k) => k).filter(k => ini && meses[k] >= ini && meses[k] <= atual);
  return idx;
}
function serie(filtro, ate, n = 12) {
  const meses = mesesAte(ate, n), tot = Object.fromEntries(meses.map(m => [m, 0]));
  for (const l of db.lanc) { if (!filtro(l)) continue; const m = mesDe(l); if (m in tot) tot[m] += efetivo(l); }
  const vals = meses.map(m => tot[m]), idx = idxMedia(meses);
  const media = idx.length ? soma(idx, k => vals[k]) / idx.length : 0;
  return { meses, vals, media, nMeses: idx.length };
}
const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
// barras (simples ou empilhadas). camadas: [{nome, cor, vals[]}]
function grafBarras(meses, camadas, { media = 0, H = 170, fmtY = fmtK, unidade = fmt } = {}) {
  const W = 340, L = 34, pb = 18, pt = 10, n = meses.length, bw = (W - L) / n;
  const tot = meses.map((m, k) => soma(camadas, c => c.vals[k]));
  const max = niceMax(Math.max(...tot, media)), y = v => H - pb - (H - pb - pt) * v / max;
  let g = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  for (const f of [0, .5, 1]) g += `<line x1="${L}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" class="grid"/><text x="${L - 4}" y="${y(max * f) + 3}" class="lb" text-anchor="end" style="text-anchor:end">${fmtY(max * f)}</text>`;
  meses.forEach((m, k) => {
    const x = L + k * bw + bw * .18, w = bw * .64; let acc = 0;
    const tip = ymLabel(m) + ': ' + unidade(tot[k]) + (camadas.length > 1 ? '\n' + camadas.filter(c => c.vals[k] > 0).map(c => c.nome + ': ' + unidade(c.vals[k])).join('\n') : '');
    camadas.forEach((c, ci) => {
      const v = c.vals[k]; if (v <= 0) return;
      const y1 = y(acc + v), y0 = y(acc); acc += v;
      const topo = camadas.slice(ci + 1).every(cc => !(cc.vals[k] > 0));
      const hh = Math.max(y0 - y1 - (topo ? 0 : 1.5), 1);
      g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="${topo ? 3 : 0}" style="fill:${c.cor}" ${c.cls ? `class="${c.cls}"` : ''}/>`;
    });
    g += `<rect x="${L + k * bw}" y="${pt}" width="${bw}" height="${H - pt}" fill="transparent" data-tip="${esc(tip)}"/>`;
    g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 4}" class="lb">${ymCurto(m)}</text>`;
  });
  if (media > 0) { const yy = y(media).toFixed(1); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" class="avg"/><text x="${W - 2}" y="${yy - 4}" class="avgt" text-anchor="end" style="text-anchor:end">média ${fmt(media)}</text>`; }
  return g + '</svg>';
}
function grafico(s, H = 160) { return grafBarras(s.meses, [{ nome: '', cor: 'var(--bar)', vals: s.vals.map((v, k) => k === s.vals.length - 1 ? 0 : v) }, { nome: '', cor: 'var(--barcur)', vals: s.vals.map((v, k) => k === s.vals.length - 1 ? v : 0) }], { media: s.media, H }); }

function gerarRecorrentes(ym = mesAtual, silencioso = false) {

async function salvarLanc() {

    forma: $('#f-forma').value, cod: $('#f-cod').value.trim(), parc: $('#f-parc').value.trim(), obs: $('#f-obs').value.trim() };
  if (!o.venc && !o.pag) return toast('Informe o vencimento ou a data de pagamento');
  const eraPago = !!l.pag;

}
function estimarMulta() {

function renderRel() {
  const L = db.lanc.filter(l => mesDe(l) === mesAtual).sort(ordem);
  const tot = soma(L, efetivo), pago = soma(L.filter(l => l.pag), efetivo);

  const meses = mesesAte(mesAtual), sg = serie(() => true, mesAtual);
  const { top, cor } = coresCategorias(meses);
  const resto = db.cats.filter(c => !top.includes(c));
  const camadas = top.map(c => ({ nome: c.nome, cor: cor(c), vals: meses.map(m => soma(db.lanc.filter(l => catDe(l.item) === c && mesDe(l) === m), efetivo)) }));
  const vOut = meses.map(m => soma(db.lanc.filter(l => mesDe(l) === m && (resto.includes(catDe(l.item)) || !catDe(l.item))), efetivo));
  if (vOut.some(v => v > 0)) camadas.push({ nome: 'Outros', cor: 'var(--s0)', vals: vOut });
  const varTxt = (a, b) => b > 0 ? (a >= b ? '+' : '−') + Math.abs((a - b) / b * 100).toFixed(0) + '%' : '—';
  // categoria: este mês vs média
  const porCat = db.cats.map(c => { const s = serie(l => catDe(l.item) === c, mesAtual); return { n: c.nome, v: s.vals[s.vals.length - 1], m: s.media }; }).filter(x => x.v > 0 || x.m > 0).sort((a, b) => b.v - a.v);
  const maxCat = Math.max(...porCat.map(x => Math.max(x.v, x.m)), 1);
  // multas e pontualidade por mês
  const multasM = meses.map(m => soma(db.lanc.filter(l => mesDe(l) === m && l.pag && l.vm > l.valor), l => l.vm - l.valor));
  const pont = meses.map(m => { const p = db.lanc.filter(l => mesDe(l) === m && l.pag && l.venc); return p.length ? soma(p, l => emDia(l) ? 1 : 0) / p.length * 100 : 0; });
  const fm = {}; for (const l of L.filter(l => l.pag)) { const k = l.forma || 'Não informada'; fm[k] = (fm[k] || 0) + efetivo(l); }
  const porForma = Object.entries(fm).sort((a, b) => b[1] - a[1]);
  const pend = L.filter(l => !l.pag);
  const pctP = (() => { const p = L.filter(l => l.pag && l.venc); return p.length ? Math.round(soma(p, l => emDia(l) ? 1 : 0) / p.length * 100) + '%' : '—'; })();
  let h = `<div class="card"><h3 class="sec">Relatório de ${ymLabel(mesAtual)}</h3><div class="mute">Gerado em ${dataBR(hojeISO())}</div>
      <table><tr><td>Total do mês</td><td class="n"><b>${fmt(tot)}</b></td></tr><tr><td>Pago</td><td class="n">${fmt(pago)}</td></tr>
      <tr><td>Falta pagar</td><td class="n">${fmt(tot - pago)}</td></tr><tr><td>Pagas em dia</td><td class="n">${pctP}</td></tr><tr><td>Multas e juros pagos</td><td class="n">${fmt(multas)}</td></tr>
      <tr><td>Mês anterior</td><td class="n">${fmt(ant)} (${varTxt(tot, ant)})</td></tr><tr><td>Média mensal</td><td class="n">${fmt(sg.media)} (${varTxt(tot, sg.media)})</td></tr></table></div>
    <div class="card"><h3 class="sec">Gastos por mês, por categoria</h3>
      ${camadas.length > 1 ? `<div class="legend">${camadas.map(x => `<span><i style="background:${x.cor}"></i>${esc(x.nome)}</span>`).join('')}</div>` : ''}
      ${grafBarras(meses, camadas.length ? camadas : [{ nome: '', cor: 'var(--bar)', vals: sg.vals }], { media: sg.media, H: 190 })}
      <p class="hint">Toque numa barra para ver os valores. Linha tracejada: média dos meses completos.</p></div>`;
  if (porCat.length) h += `<div class="card"><h3 class="sec">Este mês × média de cada categoria</h3><div class="legend"><span><i style="background:var(--acc)"></i>este mês</span><span><i style="background:var(--ink);width:3px"></i>média</span></div>
      ${porCat.map(x => { const d = x.m > 0 ? (x.v - x.m) / x.m * 100 : 0; return `<div class="hb"><span>${esc(x.n)}</span><b class="n">${fmt(x.v)}</b><div class="trk"><div class="t" style="width:${(x.v / maxCat * 100).toFixed(1)}%"></div>${x.m > 0 ? `<div class="mk" style="left:${(x.m / maxCat * 100).toFixed(1)}%"></div>` : ''}</div><div class="d">${x.m > 0 ? 'média ' + fmt(x.m) + ' · ' + (Math.abs(d) < 10 ? 'na média' : d > 0 ? '▲ ' + d.toFixed(0) + '% acima' : '▼ ' + (-d).toFixed(0) + '% abaixo') : 'sem histórico'}</div></div>`; }).join('')}</div>`;
  h += `<div class="card"><h3 class="sec">Pagas em dia (%)</h3>${grafBarras(meses, [{ nome: 'em dia', cor: 'var(--s3)', vals: pont }], { fmtY: v => Math.round(v) + '%', unidade: v => Math.round(v) + '%', H: 140 })}</div>`;

  if (pend.length) h += `<div class="card"><h3 class="sec">Em aberto (${pend.length})</h3><table>${pend.map(l => `<tr><td>${fmtData(l.venc)}</td><td>${esc(nomeItem(l.item))}</td><td class="n">${fmt(efetivo(l))}</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><h3 class="sec">Todos os lançamentos (${L.length})</h3>${L.length ? `<table><tr><th>Venc.</th><th>Item</th><th>Forma</th><th class="n">Valor</th></tr>${L.map(l => `<tr><td>${fmtData(l.venc || l.pag)}</td><td>${esc(nomeItem(l.item))}${l.pag ? '' : ' <span class="chip st-' + status(l) + '">' + statusTxt(l) + '</span>'}</td><td>${esc(l.forma)}</td><td class="n">${fmt(efetivo(l))}</td></tr>`).join('')}</table>` : '<p class="hint">Sem lançamentos.</p>'}</div>
    <div class="acts noprint"><button class="btn" data-act="csvmes">CSV do mês</button><button class="btn pri" data-act="imprimir">Imprimir / salvar PDF</button></div>`;
  $('#v-rel').innerHTML = h;
}

/* ===================== CSV / backup ===================== */
const COLS = ['id','categoria','item','vencimento','pagamento','valor','valor_com_multa','forma_pagamento','status','parcela','codigo','observacao'];
const campo = v => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const numBR = v => v ? v.toFixed(2).replace('.', ',') : '';
function toCSV(lista) {
  const out = [COLS.join(';')];
  for (const l of lista.slice().sort(ordem)) { const [c, i] = itemById(l.item); out.push([l.id, c?.nome, i?.nome, dataBR(l.venc), dataBR(l.pag), numBR(l.valor), numBR(l.vm), l.forma, statusTxt(l), l.parc, l.cod, l.obs].map(campo).join(';')); }
  return '\ufeff' + out.join('\r\n');
}
function parseCSV(txt) {
  txt = txt.replace(/^\ufeff/, '');
  const l0 = txt.split('\n')[0], sep = (l0.match(/;/g) || []).length >= (l0.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }

let bancoKey = null, bancoDados = null;
const enc = new TextEncoder();

async function derivar(pin, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);

  db.banco = { salt: db.banco.salt, iv: b64(iv), ct: b64(ct) }; save();
}
async function bancoAbrir(pin) {
  if (!window.crypto?.subtle) return toast('Criptografia indisponível: abra o app pelo endereço https do GitHub Pages');
  if (pin.length < 4) return toast('Use um PIN de pelo menos 4 dígitos');
  if (!db.banco) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    bancoKey = await derivar(pin, salt); bancoDados = []; db.banco = { salt: b64(salt) }; await bancoGravar(); toast('PIN criado. Não o esqueça: sem ele os dados não podem ser recuperados.', 5000);

}

  const esconde = () => { alvo = null; tip.classList.remove('on'); };
  document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest?.('[data-tip]'); el ? mostra(el, e.clientX, e.clientY) : alvo && esconde(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest?.('[data-tip]'); if (el && el !== alvo) mostra(el, e.clientX, e.clientY); else esconde(); });
  addEventListener('scroll', esconde, { passive: true });
})();
$$('.tabs button').forEach(b => b.onclick = () => { vista = b.dataset.v; window.scrollTo(0, 0); render(); });
$('#mesAnt').onclick = () => { mesAtual = ymAdd(mesAtual, -1); render(); };
$('#mesProx').onclick = () => { mesAtual = ymAdd(mesAtual, 1); render(); };
$('#fab').onclick = menuAdicionar;
$('#fileCam').onchange = e => { enfileirar(e.target.files); e.target.value = ''; };
$('#fileGal').onchange = e => { enfileirar(e.target.files); e.target.value = ''; };
$('#fileForm').onchange = e => { lerArquivoNoForm(e.target.files[0]); e.target.value = ''; };
$('#fileImp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const txt = await f.text();
    if (/\.json$/i.test(f.name) || txt.trim().startsWith('{')) {
      const j = JSON.parse(txt); if (!j.cats || !j.lanc) throw new Error('arquivo não é um backup deste app');
      if (!confirm('Substituir todos os dados deste aparelho pelo backup?')) return;
      j.regras ||= {}; j.cfg = { ...CFG0, ...(j.cfg || {}) }; db = j; bancoTrancar(); save(); toast('Backup restaurado');
    } else toast(importarCSV(txt) + ' lançamento(s) importado(s)');
    render();
  } catch (err) { toast('Erro ao importar: ' + err.message, 4500); }
};
addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; if (vista === 'mais') render(); });
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { bancoKey = null; bancoDados = null; return; }
  await carregarFila(); await aplicarPagosNotificacao(); autoGerar(); render(); verificarAvisos(); processarFila();
});

/* ===================== início ===================== */
(async () => {
  render();
  await carregarFila(); await limparFila();
  for (const r of fila) if (r.status === 'novo' && !r.blob) r.status = 'pergunta';
  await aplicarPagosNotificacao();
  autoGerar();
  const qs = new URLSearchParams(location.search);
  if (qs.has('entrada') || qs.has('acao')) history.replaceState(null, '', location.pathname);
  if (qs.get('acao') === 'foto') setTimeout(menuAdicionar, 300);
  render(); syncPendentes(); processarFila();
  navigator.storage?.persist?.();
  if (temSW()) {
    navigator.serviceWorker.register('sw.js').then(() => { verificarAvisos(); if ('Notification' in window && Notification.permission === 'granted') registrarSyncPeriodico(); }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', async e => { if (e.data === 'entrada') { await carregarFila(); render(); processarFila(); } if (e.data === 'pagos') aplicarPagosNotificacao(); });
  } else verificarAvisos();
  setInterval(verificarAvisos, 30 * 60 * 1000);
})();
</script>
